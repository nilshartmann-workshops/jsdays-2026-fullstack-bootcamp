services:
  backend:
    image: ghcr.io/nilshartmann-workshops/jsdays-2026-fullstack-bootcamp/backend:latest-prepare
    env_file:
      - ./backend/.env
    environment:
      DB_PATH: /var/lib/backend-db/data.db
    volumes:
      - backend_db:/var/lib/backend-db
    networks:
      - default

  frontend:
    image: ghcr.io/nilshartmann-workshops/jsdays-2026-fullstack-bootcamp/react-spa:latest-prepare
    ports:
      - "5200:80"
    depends_on:
      - backend
    networks:
      - default

volumes:
  backend_db:
